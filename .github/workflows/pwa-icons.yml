name: Prepare PWA icons
on:
  push:
    branches: [main]
    paths:
      - 'public/cliente-icon.png'
      - 'public/gestor-icon.png'
      - '.github/workflows/pwa-icons.yml'
      - 'scripts/generate-pwa-icons.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create icons without distortion
        run: |
          npm install --no-save --ignore-scripts --no-package-lock sharp@0.33.5
          node scripts/generate-pwa-icons.mjs
      - name: Publish generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add public/cliente-192.png public/cliente-512.png public/cliente-apple.png public/gestor-192.png public/gestor-512.png public/gestor-apple.png public/cliente-maskable.png public/gestor-maskable.png
          if ! git diff --cached --quiet; then
            git commit -m "build: generate installable PWA icon sizes"
            git push
          fi
